<!DOCTYPE html>
<html>

<head>
  <title>Macros Gmail</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 300px;
      padding: 10px;
    }

    h3 {
      margin-top: 0;
    }

    input {
      width: 95%;
      margin-bottom: 5px;
    }

    button {
      background-color: #4285F4;
      color: white;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
    }

    button:hover {
      background-color: #357ae8;
    }

    #macros-list {
      margin-top: 15px;
    }

    .macro-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px;
      border-bottom: 1px solid #eee;
    }

    .macro-name {
      font-weight: bold;
      cursor: pointer;
    }

    .delete-btn {
      background-color: #db4437;
      font-size: 10px;
      padding: 3px 6px;
    }
  </style>
</head>

<body>
  <h3>Nouvelle Macro</h3>
  <input type="text" id="macro-name" placeholder="Nom de la macro (ex: Factures)">
  <input type="text" id="macro-query" placeholder="Requête de recherche (ex: from:paypal subject:facture)">
  <button id="save-button">Enregistrer</button>

  <hr>
  <h3>Macros Enregistrées</h3>
  <div id="macros-list">
  </div>

  <script src="popup.js"></script>
</body>

</html>
